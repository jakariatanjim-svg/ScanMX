name: Web — Release

# Creates the next versioned web release from the selected commit.
# It does NOT deploy to Cloudflare Pages, inject a website version, or create any non-web assets.
on:
  workflow_dispatch:
    inputs:
      confirm_branch:
        description: Confirm release from a branch other than the repository default
        required: true
        type: boolean
        default: false
      version_override:
        description: Optional version, for example 3 or 1.4 (leave blank to advance automatically)
        required: false
        type: string
        default: ''

permissions:
  contents: write

# A release must never overlap or cancel another release run.
concurrency:
  group: web-release
  cancel-in-progress: false

jobs:
  release:
    name: Test, build, and publish web release
    runs-on: ubuntu-latest
    steps:
      - name: Require confirmation for a non-default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CONFIRM_BRANCH: ${{ inputs.confirm_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" && "$CONFIRM_BRANCH" != "true" ]]; then
            echo "::error::This is not the default branch ($DEFAULT_BRANCH). Re-run and check the confirm-branch box to release from $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Check out the selected commit and version tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests before building
        run: npm test

      - name: Resolve version from tags or override
        id: version
        env:
          VERSION_OVERRIDE: ${{ inputs.version_override }}
        run: node scripts/resolve-version.mjs

      - name: Ensure this version has never been released
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null; then
            echo "::error::Tag ${RELEASE_TAG} already exists. Choose a new version override; tags and releases are never reused."
            exit 1
          fi
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::A GitHub Release for ${RELEASE_TAG} already exists. Choose a new version override; releases are never overwritten."
            exit 1
          fi

      - name: Build the Cloudflare Pages-ready site
        run: npm run build

      - name: Package the Pages output
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          mkdir -p release
          (cd dist && zip -q -X -r "../release/${REPO_NAME}-web.zip" .)

      - name: Create the version tag and latest GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          gh release create "$RELEASE_TAG" "release/${REPO_NAME}-web.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "${REPO_NAME} — v${VERSION}" \
            --generate-notes \
            --latest

      - name: Summarize release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}"
          {
            echo '### Web release'
            echo '| Branch | Version | Tag | Release link |'
            echo '|---|---|---|---|'
            echo "| \`${GITHUB_REF_NAME}\` | v${VERSION} | \`${RELEASE_TAG}\` | [GitHub Release](${release_url}) |"
          } >> "$GITHUB_STEP_SUMMARY"
