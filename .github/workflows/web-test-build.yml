name: Web — Test Build

# Builds a Cloudflare Pages-ready web artifact on any branch.
# It does NOT create tags/releases, publish a live site, or deploy to Cloudflare.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Test and package web build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected branch and version tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Resolve a non-advancing version label
        id: version
        run: node scripts/resolve-version.mjs

      - name: Build the Cloudflare Pages-ready site
        run: npm run build

      - name: Package site for download
        id: package
        shell: bash
        run: |
          repo_name="${GITHUB_REPOSITORY##*/}"
          safe_branch="$(printf '%s' "$GITHUB_REF_NAME" | sed -E 's/[^A-Za-z0-9._-]+/-/g; s/^-+|-+$//g')"
          safe_branch="${safe_branch:-branch}"
          short_sha="${GITHUB_SHA:0:7}"
          mkdir -p release
          (cd dist && zip -q -X -r "../release/${repo_name}-web.zip" .)
          echo "artifact_name=${repo_name}-${safe_branch}-${short_sha}-v${VERSION}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: release/${{ github.event.repository.name }}-web.zip
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Summarize test build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_NAME: ${{ steps.package.outputs.artifact_name }}
        run: |
          {
            echo '### Web test build'
            echo '| Branch | Version label | Tag | Release link |'
            echo '|---|---|---|---|'
            echo "| \`${GITHUB_REF_NAME}\` | v${VERSION} | — (test only) | — (not published) |"
            echo
            echo "Artifact: \`${ARTIFACT_NAME}\` (available for 7 days)."
          } >> "$GITHUB_STEP_SUMMARY"
