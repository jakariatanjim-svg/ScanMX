name: Build and release standalone HTML

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scanmx-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build ScanMX and publish a release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Install the test browser
        run: npx playwright install --with-deps chromium

      - name: Build and verify the standalone app offline
        run: npm run test:e2e

      - name: Prepare the dated release asset
        id: release-info
        shell: bash
        run: |
          stamp="$(date -u '+%Y-%m-%d-%H-%M-%S')"
          tag="scanmx-${stamp}-${GITHUB_RUN_NUMBER}"
          release_name="ScanMX-${stamp}"
          mkdir -p release
          cp dist/index.html "release/${release_name}.html"
          echo "stamp=${stamp}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${release_name}" >> "$GITHUB_OUTPUT"
          echo "asset=release/${release_name}.html" >> "$GITHUB_OUTPUT"
          echo "Built ${release_name}.html ($(du -h "release/${release_name}.html" | cut -f1))"

      - name: Confirm the release is a single HTML file
        shell: bash
        run: |
          test -s "${{ steps.release-info.outputs.asset }}"
          if grep -Eqi '<script[^>]+src=|<link[^>]+stylesheet[^>]+href=' "${{ steps.release-info.outputs.asset }}"; then
            echo "The app build contains a separate runtime asset; expected one self-contained HTML file."
            exit 1
          fi

      - name: Create a tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(cat <<EOF
          ScanMX standalone offline document scanner.

          - Branch: \`${GITHUB_REF_NAME}\`
          - Download the attached HTML file and open it in a modern browser.
          - Scanning and enhancement run locally on your device; no photos are uploaded.
          EOF
          )"
          gh release create "${{ steps.release-info.outputs.tag }}" \
            "${{ steps.release-info.outputs.asset }}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.release-info.outputs.release_name }}" \
            --notes "$notes"
